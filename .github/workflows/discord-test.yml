

name: Discord Connection Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Send test message
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.error

          url = os.environ["DISCORD_WEBHOOK"]
          data = json.dumps({
              "content": "Cloud test successful! Your bot is connected."
          }).encode()

          request = urllib.request.Request(
              url,
              data=data,
              headers={"Content-Type": "application/json"},
              method="POST"
          )

          try:
              with urllib.request.urlopen(request, timeout=15) as response:
                  print("SUCCESS: HTTP", response.status)
          except urllib.error.HTTPError as error:
              print("Discord HTTP status:", error.code)
              print("Discord response:", error.read().decode(
                  "utf-8", "replace"
              ))
              raise
          PY
